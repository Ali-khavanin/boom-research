[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-skill-agent"
version = "0.1.0"
description = "Graph-driven research agent compiled from methodology skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "textual>=0.80",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=4.2",
  "jsonschema>=4.22",
  # Supplies extractor runtime dependencies for the interpreter passed as PYTHON_BIN.
  "book-to-skill[pdf] @ git+https://github.com/virgiliojr94/book-to-skill.git@c108d25b0cb58e1bdc361f3de02ed9f37075152f",
  "tomli-w>=1.0",
  "platformdirs>=4",
  "trafilatura>=1.12",
]

[project.scripts]
ragent = "ragent.cli.main:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["src/ragent"]

[tool.hatch.build]
include = ["src/ragent/data/*.json"]

[tool.hatch.metadata]
allow-direct-references = true
